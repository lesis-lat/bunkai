name: Test Coverage

on:
  workflow_call:

jobs:
  coverage:
    runs-on: ubuntu-latest
    container: davorg/perl-coveralls:latest
    name: Test coverage

    defaults:
      run:
        working-directory: ./

    outputs:
      coverage_percent: ${{ steps.coverage_percent.outputs.coverage }}
      coverage_badge_url: ${{ steps.set_badge_url.outputs.badge_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Install modules
        run: cpanm --installdeps . --with-develop --mirror https://cpan.metacpan.org --mirror-only -n

      - name: Run tests with coverage
        run: |
          PERL5OPT='-MDevel::Cover=-silent,1,-select,^lib/,-ignore,.' \
            prove -Ilib -Itests/lib -r tests/unit tests/integration tests/e2e

      - name: Generate coverage report
        run: cover

      - name: Enforce the coverage floor
        run: |
          cover -silent -report text -coverage statement,branch,subroutine \
            | awk '/^Total/ { if ($2 + 0 < 90) { print "statement coverage below 90%: " $2; exit 1 } }'

      - id: coverage_percent
        name: Extract total coverage percentage
        run: echo "coverage=$(cover | perl -ne 'print +(split)[-1] if /^Total\b/')" >> $GITHUB_OUTPUT

      - id: set_badge_url
        name: Determine badge color and URL
        run: |
          COVERAGE=${{ steps.coverage_percent.outputs.coverage }}
          echo "Coverage: $COVERAGE"
          if (( $(echo "$COVERAGE >= 90" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          BADGE_URL="https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}"
          echo "badge_url=$BADGE_URL" >> $GITHUB_OUTPUT
