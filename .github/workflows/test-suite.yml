name: Test Suite

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Perl
        run: |
          sudo apt-get update
          sudo apt-get install -y perl cpanminus

      - name: Install dependencies
        run: sudo cpanm --installdeps . --mirror https://cpan.metacpan.org --mirror-only -n

      - name: Run the unit tests
        run: prove -Ilib -Itests/lib -r tests/unit

      - name: Run the integration tests
        run: prove -Ilib -Itests/lib -r tests/integration

      - name: Run the end to end tests
        run: prove -Ilib -Itests/lib -r tests/e2e

  coverage:
    uses: ./.github/workflows/test-coverage.yml

  report-coverage:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Show coverage results
        run: |
          echo "Total coverage percentage: ${{ needs.coverage.outputs.coverage_percent }}%"
          echo "Coverage badge URL: ${{ needs.coverage.outputs.coverage_badge_url }}"
